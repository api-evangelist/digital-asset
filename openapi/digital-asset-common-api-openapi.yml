openapi: 3.2.0
info:
  title: Utilities Common API
  description: Exposes technical information and contract data of the Utility App
  version: 2.1.0
servers:
- url: http://localhost:8080
tags:
- name: Common
paths:
  /:
    get:
      tags:
      - Common
      operationId: root
      x-jvm-package: health
      responses:
        '200':
          description: ok
      summary: Root
      x-summary-source: derived
  /readyz:
    get:
      tags:
      - Common
      operationId: isReady
      x-jvm-package: health
      responses:
        '200':
          description: ok
        '503':
          description: service unavailable
      summary: Is ready
      x-summary-source: derived
  /livez:
    get:
      tags:
      - Common
      operationId: isLive
      x-jvm-package: health
      responses:
        '200':
          description: ok
        '503':
          description: service unavailable
      summary: Is live
      x-summary-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
