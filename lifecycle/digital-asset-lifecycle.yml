method: searched
source: https://docs.digitalasset.com/registry/releases/versioning
versioning:
  scheme: uri-path (API) + X.Y semantic-ish (Registry App)
  current_registry_app: '0.13'
  current_utilities_api_spec: 2.1.0
  api_path_versions: [/api/utilities/v0, /api/token-standard/v0 with v1 sub-APIs]
  policy: >-
    "Registry App versions are numbered using an X.Y format. Each minor release adopts a new
    set of Daml models. These are compatible upgrades of the models released in the previous
    minor release. The major version is incremented when there are breaking changes that
    require an extensive contract migration."
  docs: https://docs.digitalasset.com/registry/releases/versioning
  cadence: at most one release per month
deprecation:
  policy_url: https://docs.digitalasset.com/registry/releases/versioning
  sunset_header: false
  rfc8594: false
  support_window: >-
    "At any given time, we strive to support the two minor versions before the current
    release." With the rollout of 0.12, support for 0.9 is dropped — transactions submitted
    with 0.9 Daml packages are expected to fail, while 0.10 and 0.11 continue to work.
  communication: >-
    "Deprecation of the old version, as well as the target upgrade path for integrations, is
    communicated as part of the release notes."
  mechanism: >-
    Deprecation is enforced at the Daml package/model layer (contract vetting on the validator
    node), not through HTTP Deprecation/Sunset response headers.
rollout:
  environments: [DevNet, TestNet, MainNet]
  strategy: staggered
  interval: one week between environments
  order: DevNet -> TestNet -> MainNet
  adoption: >-
    "In order to adopt a new release, it is sufficient for the newly introduced Daml packages
    to be uploaded and vetted by the operator of your validator node."
  integration_guide: Provided with each release's release notes.
