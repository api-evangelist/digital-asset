aid: digital-asset
name: Digital Asset
description: >-
  Digital Asset is the company behind Canton, a privacy-enabled public blockchain built for
  regulated institutional finance, and Daml, the smart-contract language that runs on it.
  Its commercial products sit on top of the Canton Network: the DA Registry, a
  production platform for issuing, minting, burning, transferring and redeeming
  institutional-grade tokenized assets with credential-based allowlists, blocklists and
  proof-of-transfer; xReserve, which brings Circle's USDC onto Canton; and a Covalidation
  Service for operating validator infrastructure. Its public developer surface is the
  Utilities (Operator Backend) API plus four Canton Token Standard (CIP-56) off-ledger
  APIs — token metadata, transfer instruction, allocation and allocation instruction —
  all published as OpenAPI 3.0 and served across MainNet, TestNet and DevNet environments.
  Digital Asset also publishes an A2A agent card and a packaged Agent Skill for its
  Registry workflows.
