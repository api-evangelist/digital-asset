apis:
- aid: digital-asset:utilities
  name: Digital Asset Utilities API (Operator Backend)
  description: >-
    The Operator Backend for the DA Registry. Exposes publicly accessible endpoints that serve
    the off-ledger information required to advance Utility Daml workflows via explicit contract
    disclosure — the operator party identifier, the vetted Daml packages, instrument
    configurations, and the factory and choice contexts for mint, burn, burn-mint and transfer
    proof workflows. Used by the Registry UI, by wallets, and by third-party apps.
  humanURL: https://docs.digitalasset.com/registry/apis/operator-backend-api
  baseURL: https://api.utilities.digitalasset.com
  tags:
  - Tokenization
  - Registry
  - Blockchain
  properties:
  - type: OpenAPI
    url: openapi/digital-asset-utilities-openapi.yml
  - type: OpenAPI
    name: Runtime-served specification
    url: openapi/digital-asset-utilities-runtime-openapi.yml
  - type: Documentation
    url: https://docs.digitalasset.com/registry/apis/operator-backend-api
  - type: APIReference
    url: https://docs.digitalasset.com/api-reference/operator/get-apiutilitiesv0operator
- aid: digital-asset:token-metadata-v1
  name: Digital Asset Token Metadata API (CIP-56)
  description: >-
    Canton Token Standard token metadata service. Read-only off-ledger API returning registry
    information — including the token-standard versions the registry supports — and the
    instruments a registrar administers, with per-instrument metadata lookup.
  humanURL: https://docs.digitalasset.com/registry/apis/token-standard/off-ledger-api
  baseURL: https://api.utilities.digitalasset.com
  tags:
  - Token Standard
  - Metadata
  properties:
  - type: OpenAPI
    url: openapi/digital-asset-token-metadata-v1-openapi.yml
  - type: Documentation
    url: https://docs.digitalasset.com/registry/apis/token-standard
- aid: digital-asset:transfer-instruction-v1
  name: Digital Asset Transfer Instruction API (CIP-56)
  description: >-
    Canton Token Standard transfer-instruction off-ledger API. Returns the transfer factory and
    choice context needed to execute a direct transfer, and the choice contexts to accept,
    reject or withdraw a two-step transfer instruction.
  humanURL: https://docs.digitalasset.com/registry/apis/token-standard/off-ledger-api
  baseURL: https://api.utilities.digitalasset.com
  tags:
  - Token Standard
  - Transfers
  properties:
  - type: OpenAPI
    url: openapi/digital-asset-transfer-instruction-v1-openapi.yml
  - type: Documentation
    url: https://docs.digitalasset.com/registry/apis/token-standard
- aid: digital-asset:allocation-v1
  name: Digital Asset Allocation API (CIP-56)
  description: >-
    Canton Token Standard allocation off-ledger API. Returns the choice contexts required to
    execute the transfer of, withdraw, or cancel an existing allocation — the settlement
    primitive behind delivery-versus-payment style workflows on Canton.
  humanURL: https://docs.digitalasset.com/registry/apis/token-standard/off-ledger-api
  baseURL: https://api.utilities.digitalasset.com
  tags:
  - Token Standard
  - Settlement
  properties:
  - type: OpenAPI
    url: openapi/digital-asset-allocation-v1-openapi.yml
  - type: Documentation
    url: https://docs.digitalasset.com/registry/apis/token-standard
- aid: digital-asset:allocation-instruction-v1
  name: Digital Asset Allocation Instruction API (CIP-56)
  description: >-
    Canton Token Standard allocation-instruction off-ledger API. Returns the allocation factory
    and choice context for creating allocations through the AllocationFactory_Allocate choice.
  humanURL: https://docs.digitalasset.com/registry/apis/token-standard/off-ledger-api
  baseURL: https://api.utilities.digitalasset.com
  tags:
  - Token Standard
  - Settlement
  properties:
  - type: OpenAPI
    url: openapi/digital-asset-allocation-instruction-v1-openapi.yml
  - type: Documentation
    url: https://docs.digitalasset.com/registry/apis/token-standard
