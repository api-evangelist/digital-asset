- name: verify_transfer_proof
  description: 'Verify the outcome of a transfer of Registry Utility assets on Canton.  Given an UpdateID
    and a Transfer Object, the service looks up the corresponding ledger transaction and verifies the
    transfer details against the on-chain events.  The response status indicates the transfer outcome:
    - `Success`: The transfer was executed in the referenced transaction - `Pending`: The transfer instruction
    has been created but not yet settled - `Failure`: The transfer instruction was rejected or withdrawn
    by one of the parties  If none of the above conditions are met, if the provided transfer details do
    not match the on-chain data, or if the original TransferInstruction contract cannot be retrieved,
    a `400` is returned. No further diagnostic information is included in the error response to prevent
    unintended disclosure of sensitive ledger data.'
  source_operation: openapi/digital-asset-utilities-openapi.yml#verifyTransferProof
  http_method: POST
  path: /api/utilities/v0/registry/transfer/v0/proof
  category: registry
