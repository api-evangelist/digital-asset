pointer_policy: >-
  NO `type: MCPServer` pointer is wired into apis.yml for this provider. Digital Asset does
  not operate an MCP server, and the MCPServer type is what the ergonomics `mcp_server_present`
  check (4 pts) and the agent-readiness `mcp_server` dimension (12 pts) read. Wiring it from a
