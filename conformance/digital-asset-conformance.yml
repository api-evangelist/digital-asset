- id: cip-56-canton-token-standard
  conforms: true
  evidence: >-
    Four dedicated off-ledger APIs implement the Canton Token Standard (CIP-56) —
    token-metadata v1, transfer-instruction v1, allocation v1 and allocation-instruction v1.
    getRegistryInfo returns a `supportedApis` map declaring which standard versions the
    registry supports. Documented at
    https://docs.digitalasset.com/registry/apis/token-standard.
- id: cip-103-dapp-api
  conforms: partial
  evidence: >-
    The Canton Network dApp SDK implements CIP-103; that SDK is published by the
    canton-network org rather than digital-asset, so it is recorded as ecosystem, not a
    first-party Digital Asset conformance claim.
- id: cip-104
  conforms: true
  evidence: >-
    Digital Asset publishes CIP-104 guidance for Registry tokenizers configuring featured
    parties — https://docs.digitalasset.com/registry/guides/cip-104-guidance.
- id: a2a-agent-card
  conforms: true
  grade: conformant
  evidence: >-
